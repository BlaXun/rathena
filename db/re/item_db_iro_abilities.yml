  - Id: 470192
    AegisName: Fifth_Element
    Script: |
      .@r = getrefine();
      .@a = getskilllv("SO_SUMMON_AGNI")+getskilllv("SO_SUMMON_AQUA")+getskilllv("SO_SUMMON_VENTUS")+getskilllv("SO_SUMMON_TERA");
      bonus bMdef,10+(4*.@a);
      bonus bInt,5*.@a;
      bonus bMaxHPrate,3;
      bonus bMaxSPrate,3;
      bonus bMatkRate,10*getskilllv("SO_EL_SYMPATHY");
      bonus2 bSubRace,RC_Player_Human,10;
      if (getskilllv("SO_VARETYR_SPEAR") == 10) {
         bonus2 bFixedCastrate,"SO_VARETYR_SPEAR",-100;
         bonus2 bSkillCooldown,"SO_SUMMON_AQUA",-25000;
      }
      if (getskilllv("SO_PSYCHIC_WAVE") == 5) {
         bonus2 bSubClass,Class_Normal,5;
         bonus2 bSubClass,Class_Boss,5;
      }
      if (.@r>=5) {
         bonus bMaxHPrate,7;
         bonus bMaxSPrate,7;
         bonus bDelayrate,-10;
      }
      if (.@r>=7) {
         bonus bMaxHPrate,10;
         bonus bMaxSPrate,10;
         bonus bDelayrate,-10;
      }
      // iRO: Fifth Element: "When learned Varetyr Spear Lv 10, enables Lord of Vermilion Lv 10"; "When learned Call Ventus Lv 3, when using Electric Walk, increases movement speed for 30 sec."
      if (getskilllv("SO_VARETYR_SPEAR") >= 10)
         skill "WZ_VERMILION",10;
      if (getskilllv("SO_SUMMON_VENTUS") >= 3)
         autobonus3 "{ bonus bSpeedRate,25; }",1000,30000,"SO_ELECTRICWALK";
  - Id: 480188
    AegisName: Valkyrie_Curse_blight
    Script: |
      .@r = getrefine();
      bonus2 bSubClass,Class_All,5;
      bonus2 bSubRace,RC_Player_Human,5;
      bonus bMaxHPrate,2*.@r;
      bonus bMaxSPrate,2*.@r;
      bonus2 bSubEle,Ele_Ghost,7*.@r;
      if (.@r>=7) {
         bonus bAllStats,10;
         bonus2 bAddEle,Ele_All,10;
         bonus2 bMagicAddEle,Ele_All,10;
      }
      if (.@r>=9) {
         bonus2 bAddEle,Ele_All,15;
         bonus2 bMagicAddEle,Ele_All,15;
         bonus bDefRatioAtkClass,Class_All;
      }
      // iRO: Valkyrie Curse Blight: "Enables to use Spell Breaker Lv 5."
      skill "SA_SPELLBREAKER",5;
