//########################################################################
// Extension Database
//########################################################################
//
// Server-side toggles for behaviour that deviates from stock rAthena.
// Each entry gates a specific code path elsewhere in the server;
// disabling an extension restores the stock behaviour.
//
// Every entry is off by default. To enable one on this server, do NOT
// edit this file -- copy the Id into db/import/extension_db.yml with
// Enabled: true and it will be picked up on the next reload. Mods do
// the same through their own db/ folder.
//
//########################################################################
// - Id            Stable identifier the C code and script commands use.
//                 Snake_case, lowercase, short.
//   Name          One-line human-readable label (shown by @extensions).
//   Description   Multi-line explanation (shown by @extensioninfo).
//   Enabled       true / false. Defaults to false. Overrides in
//                 db/import/extension_db.yml only need Id and Enabled.
//########################################################################

Header:
  Type: EXTENSION_DB
  Version: 1

Body:
  - Id: pc_drop_item_event
    Name: Fire OnPCDropItemEvent per monster drop
    Description: |
      When a monster's regular drop table rolls a drop for a player, fire
      an NPCE_DROPITEM script event on that player before the flooritem
      is placed on the map. The event's script label is OnPCDropItemEvent
      and the following player parameters are set for the duration of the
      handler:

        killedgid     the mob's unique unit id
        killedrid     the mob's mob_db id (its class id)
        killeddropid  the item id that was rolled
        killedbyme    1 if the drop recipient (this pc) also dealt the
                      killing blow; 0 if a party mate, merc, homun, or
                      someone else got the kill

      Fires once per successful drop -- a mob that drops three items in
      one death fires it three times, once per item. Off means stock
      rAthena: no such event exists.

Footer:
  Imports:
    - Path: db/import/extension_db.yml
