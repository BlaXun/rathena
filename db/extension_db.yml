#########################################################################
# Extension Database
#########################################################################
#
# Server-side toggles for behaviour that deviates from stock rAthena.
# Each entry gates a specific code path elsewhere in the server;
# disabling an extension restores the stock behaviour.
#
# Every entry is off by default. To enable one on this server, do NOT
# edit this file -- copy the Id into db/import/extension_db.yml with
# Enabled: true and it will be picked up on the next reload. Mods do
# the same through their own db/ folder.
#
#########################################################################
# - Id            Stable identifier the C code and script commands use.
#                 Snake_case, lowercase, short.
#   Name          One-line human-readable label (shown by @extensions).
#   Description   Multi-line explanation (shown by @extensioninfo).
#   Enabled       true / false. Defaults to false. Overrides in
#                 db/import/extension_db.yml only need Id and Enabled.
#########################################################################

Header:
  Type: EXTENSION_DB
  Version: 1

Body:
  - Id: blaze_shield_knockback
    Name: "Blaze Shield pin on entry"
    Description: |
      Make NJ_KAENSIN (Blaze Shield / Blazing Field) pillars hit the
      moment a mob walks onto them, and pin the mob there until the
      pillar's full stack of hits burns out.
      Stock KAENSIN only damages via the 100 ms global skill_unit_timer:
      a mob fast enough to cross a cell between global ticks skips it,
      so most pillars in the 5x5 donut never see the mob. With this on,
      walking onto a pillar fires the hit immediately (no cell can be
      skipped, regardless of mob walkspeed) and applies a skill-induced
      walkdelay of val2 * interval ms, so the mob stays on the pillar
      until it burns out, then moves to the next one.
      Endure (SC_ENDURE) and MD_STATUSIMMUNE skip the pin -- an endure
      mob still eats the entry hit but can keep walking, matching the
      stock escape hatch for firewall-family cells.
      Off by default; stock behaviour is unchanged.
    Enabled: false

Footer:
  Imports:
    - Path: db/import/extension_db.yml
