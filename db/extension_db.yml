//########################################################################
// Extension Database
//########################################################################
//
// Server-side toggles for behaviour that deviates from stock rAthena.
// Each entry gates a specific code path elsewhere in the server;
// disabling an extension restores the stock behaviour.
//
// Every entry is off by default. To enable one on this server, do NOT
// edit this file -- copy the Id into db/import/extension_db.yml with
// Enabled: true and it will be picked up on the next reload. Mods do
// the same through their own db/ folder.
//
//########################################################################
// - Id            Stable identifier the C code and script commands use.
//                 Snake_case, lowercase, short.
//   Name          One-line human-readable label (shown by @extensions).
//   Description   Multi-line explanation (shown by @extensioninfo).
//   Enabled       true / false. Defaults to false. Overrides in
//                 db/import/extension_db.yml only need Id and Enabled.
//########################################################################

Header:
  Type: EXTENSION_DB
  Version: 1

Body:
  - Id: makeitem_owned
    Name: makeitemowned script command
    Description: |
      Adds a `makeitemowned` script command that places a flooritem the
      way `makeitem` does, plus pickup-priority character ids on the
      flooritem -- so a script can drop an item bound to a specific
      player for a short window, exactly like a mob's own drops.

      Signature:
        makeitemowned <item>,<amount>,"<map>",<X>,<Y>
                     {,<first_charid>{,<second_charid>{,<third_charid>}}};

      The three char ids are optional. first_charid defaults to the
      attached player's char_id (via script_rid2sd); second and third
      default to 0 (no priority). The pickup-priority durations for the
      three slots are the standard battle.conf knobs
      (item_first_get_time, item_second_get_time, item_third_get_time),
      shared with regular mob drops.

      Off means stock rAthena: the command is registered but every call
      returns failure and logs a one-line error, so scripts that reach
      for it fail loudly rather than silently placing an unowned drop.

Footer:
  Imports:
    - Path: db/import/extension_db.yml
