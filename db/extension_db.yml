//########################################################################
// Extension Database
//########################################################################
//
// Server-side toggles for behaviour that deviates from stock rAthena.
// Each entry gates a specific code path elsewhere in the server;
// disabling an extension restores the stock behaviour.
//
// Every entry is off by default. To enable one on this server, do NOT
// edit this file -- copy the Id into db/import/extension_db.yml with
// Enabled: true and it will be picked up on the next reload. Mods do
// the same through their own db/ folder.
//
//########################################################################
// - Id            Stable identifier the C code and script commands use.
//                 Snake_case, lowercase, short.
//   Name          One-line human-readable label (shown by @extensions).
//   Description   Multi-line explanation (shown by @extensioninfo).
//   Enabled       true / false. Defaults to false. Overrides in
//                 db/import/extension_db.yml only need Id and Enabled.
//########################################################################

Header:
  Type: EXTENSION_DB
  Version: 1

Body:
  - Id: blaze_shield_drain
    Name: "Blaze Shield SP/HP drain hook"
    Description: |
      Route each NJ_KAENSIN (Blaze Shield / Blazing Field) pillar tick
      through battle_drain(). Item bonuses that sit on the weapon-attack
      path -- bSPDrainValue, bHPDrainValue, bSPDrainValueRace,
      bHPDrainValueRace, bSPDrainValueClass, bHPDrainValueClass and the
      drain-rate variants -- then fire per hit for a Ninja channelling
      Blaze Shield, as they already do for weapon attacks.
      Motivating case: Moonlight Dagger's bonus bSPDrainValue,3, which
      is inert on Blaze Shield under stock rAthena because battle_drain
      is only called from the weapon-attack path.
      Gated on sg->skill_id == NJ_KAENSIN, so Fire Wall (which shares the
      UNT_KAEN branch through UNT_FIREWALL) is unaffected.
      Off by default; stock behaviour is unchanged.
    Enabled: false
